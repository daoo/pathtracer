[package]
name = "kdtree-tester-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "error-context", "help", "usage", "derive"] }
geometry = { version = "1.0.0", path = "../geometry" }
glam = "0.33.7"
kdtree = { version = "1.0.0", path = "../kdtree" }
rand = { version = "0.10.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
tracing = { version = "1.0.0", path = "../tracing" }
wavefront = { version = "1.0.0", path = "../wavefront" }
